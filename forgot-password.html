<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Digital Agriculture</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="forgot-password-page">
    <div class="login-center">
        <div class="login-card">
            <div class="login-heading">
                <div class="login-icon">🔑</div>
                <h1>Reset your password</h1>
                <p id="pageSubtitle">Enter your email to receive a password reset link.</p>
            </div>

            <form id="forgotForm">
                <div class="login-form-group">
                    <label>Email Address</label>
                    <div class="login-input">
                        <span>✉</span>
                        <input type="email" name="email" placeholder="Enter your registered email" required>
                    </div>
                </div>

                <button type="submit" class="login-button" id="forgotButton">Send reset link</button>
            </form>

            <div id="resetBox" hidden>
                <div class="login-divider"><span>RESET</span></div>
                <form id="resetForm">
                    <input type="hidden" name="token" id="resetTokenInput">
                    <div class="login-form-group">
                        <label>New Password</label>
                        <div class="login-input">
                            <span>🔒</span>
                            <input type="password" name="password" minlength="12" maxlength="72" placeholder="Enter a new password" required>
                        </div>
                    </div>
                    <div class="login-form-group">
                        <label>Confirm Password</label>
                        <div class="login-input">
                            <span>🔒</span>
                            <input type="password" name="confirmPassword" minlength="12" maxlength="72" placeholder="Repeat your new password" required>
                        </div>
                    </div>
                    <button type="submit" class="login-button" id="resetButton">Update password</button>
                </form>
            </div>

            <p id="loginMessage" role="alert" aria-live="polite"></p>
            <p id="tokenHint" class="register-link" style="display:none;"></p>
            <p class="register-link"><a href="login.html">Back to login</a></p>
        </div>
    </div>
</div>

<script>
const API_HOST = window.location.hostname || "localhost";
const API_BASE = window.DIGITAL_AGRICULTURE_API || `http://${API_HOST}:8080/api`;

const queryToken = new URLSearchParams(window.location.search).get("token");
const forgotForm = document.getElementById("forgotForm");
const resetBox = document.getElementById("resetBox");
const resetTokenInput = document.getElementById("resetTokenInput");
const loginMessage = document.getElementById("loginMessage");
const pageSubtitle = document.getElementById("pageSubtitle");
const tokenHint = document.getElementById("tokenHint");

async function csrfToken() {
    const response = await fetch(`${API_BASE}/csrf`, { credentials: "include" });
    if (!response.ok) throw new Error("Could not connect to the server. Is the backend running?");
    return (await response.json()).token;
}

function showResetToken(token) {
    resetBox.hidden = false;
    resetTokenInput.value = token;
    pageSubtitle.textContent = "Use the reset token below to choose a new password.";
    tokenHint.style.display = "block";
    tokenHint.innerHTML = `Reset token: <strong>${token}</strong> <br> (for demo/local testing) <a href="forgot-password.html?token=${encodeURIComponent(token)}">Open reset link</a>`;
}

if (queryToken) {
    resetBox.hidden = false;
    resetTokenInput.value = queryToken;
    pageSubtitle.textContent = "Choose a new password for your account.";
}

forgotForm.addEventListener("submit", async event => {
    event.preventDefault();
    const button = document.getElementById("forgotButton");
    const email = new FormData(forgotForm).get("email");
    loginMessage.textContent = "";
    button.disabled = true;
    try {
        const token = await csrfToken();
        const response = await fetch(`${API_BASE}/auth/password/forgot`, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json", "X-XSRF-TOKEN": token },
            body: JSON.stringify({ email })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Unable to trigger a password reset.");
        loginMessage.textContent = result.message || "If an account exists for the email, a reset link has been created.";
        if (result.resetToken) {
            showResetToken(result.resetToken);
        } else {
            pageSubtitle.textContent = "If an account exists, you can use the generated reset link shown after the request.";
        }
    } catch (error) {
        loginMessage.textContent = error.message;
    } finally {
        button.disabled = false;
    }
});

document.getElementById("resetForm").addEventListener("submit", async event => {
    event.preventDefault();
    const form = event.currentTarget;
    const password = form.elements.password.value;
    const confirmPassword = form.elements.confirmPassword.value;
    const token = form.elements.token.value;
    const button = document.getElementById("resetButton");
    loginMessage.textContent = "";
    if (password !== confirmPassword) {
        loginMessage.textContent = "Passwords do not match.";
        return;
    }
    button.disabled = true;
    try {
        const csrf = await csrfToken();
        const response = await fetch(`${API_BASE}/auth/password/reset`, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json", "X-XSRF-TOKEN": csrf },
            body: JSON.stringify({ token, password })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Password reset failed.");
        loginMessage.textContent = result.message || "Your password has been updated.";
        setTimeout(() => { window.location.href = "login.html"; }, 1200);
    } catch (error) {
        loginMessage.textContent = error.message;
    } finally {
        button.disabled = false;
    }
});
</script>
</body>
</html>
